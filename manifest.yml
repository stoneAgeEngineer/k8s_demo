apiVersion: v1 ## Api version when POD was added in K8S contruct
kind : Pod ## what we starting from kind . Starting pod here
metadata:
  name: nginx ## name of the pod
  labels: 
    app: nginx
spec:
  containers: ## containers inside the pod
    - name : nginx
      image : nginx 
      ports : 
        - containerPort: 80

## kubectl apply -f <manifest.yml_file_path>
