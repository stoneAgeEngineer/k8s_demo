apiVersion: apps/v1
kind: Deployment
metadata:
  name: assignment1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assignment1
  template :
    metadata:
      labels:
        app : assignment1
    spec:
      containers:
        - name: pg
          image : postgres
          ports: 
            - containerPort: 80

        - name: my-local-app
          image: myLocalApp:lastest
          ports:
            - containerPort: 8080

    
