apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-1-nginx-deployment
spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: test-1-nginx-container
          image: nginx:latest
          ports:
            - containerPort: 80

        





